<main class="grid min-h-screen place-items-center bg-gray-50 px-6 py-24">
  <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-sm ring-1 ring-gray-200">
    <h1 class="text-2xl font-semibold text-gray-900">User Login</h1>

    <p class="mt-1 text-sm text-gray-500">Enter your credentials to continue</p>

    <form class="mt-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <!-- EMAIL -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">
          Email: admin@example.com | user@example.com
        </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="admin@example.com"
          class="mt-1 w-full rounded-md border px-3 py-2 text-sm shadow-sm outline-none transition focus:ring-2 focus:ring-indigo-500"
          [ngClass]="{
            'border-red-500 focus:ring-red-500':
              form.get('email')?.invalid && form.get('email')?.touched,
          }"
        />

        <div
          class="mt-1 text-sm text-red-600"
          *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
        >
          <div *ngIf="form.get('email')?.errors?.['required']">Email is required.</div>
          <div *ngIf="form.get('email')?.errors?.['email']">
            Please enter a valid email address.
          </div>
        </div>
      </div>

      <!-- PASSWORD -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">
          Password: admin123 | user123
        </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="admin123"
          class="mt-1 w-full rounded-md border px-3 py-2 text-sm shadow-sm outline-none transition focus:ring-2 focus:ring-indigo-500"
          [ngClass]="{
            'border-red-500 focus:ring-red-500':
              form.get('password')?.invalid && form.get('password')?.touched,
          }"
        />

        <div
          class="mt-1 text-sm text-red-600"
          *ngIf="form.get('password')?.touched && form.get('password')?.invalid"
        >
          <div *ngIf="form.get('password')?.errors?.['required']">Password is required.</div>
        </div>
      </div>

      <!-- BOTÓN -->
      <button
        type="submit"
        class="w-full rounded-md bg-indigo-600 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 disabled:opacity-50"
        [disabled]="form.invalid || isLoading()"
      >
        Login
      </button>
    </form>

    <!-- LOADING -->
    @if (isLoading()) {
      <div class="mt-4 flex justify-center">
        <svg class="h-6 w-6 animate-spin text-indigo-600" viewBox="0 0 24 24" fill="none">
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          />
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z" />
        </svg>
      </div>
    }
  </div>
</main>
