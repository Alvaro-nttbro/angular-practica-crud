<header class="flex items-center justify-between border-b border-gray-200 px-4 py-3">
  <div class="text-sm font-semibold text-gray-700">Foro coches</div>

  <div class="text-sm font-semibold text-gray-700">Bienvenido, {{ user()?.name }}</div>
  <div class="text-sm font-semibold text-gray-700">Rol: {{ user()?.role }}</div>

  <button
    class="rounded-md bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-500"
    (click)="logout()"
  >
    Logout
  </button>
</header>
